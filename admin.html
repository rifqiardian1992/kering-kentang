<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2B632">
  <title>Penjual – Kering Kentang Tara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <meta name="robots" content="noindex">
  <script>
    // Penangkap error paling awal: tetap jalan walaupun script utama gagal dibaca browser.
    window.addEventListener('error', function (e) {
      var el = document.getElementById('loading');
      if (!el) return;
      el.className = 'pesan err';
      el.style.display = 'block';
      el.textContent = 'Halaman error: ' + e.message + (e.lineno ? ' (baris ' + e.lineno + ')' : '');
    });
  </script>
  <style>
    .wrap { max-width: 760px; padding-bottom: 60px; }
    .atas { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding-bottom: 14px; border-bottom: 4px solid var(--kentang); }
    .atas .kanan { display: flex; gap: 8px; }
    .atas .kanan button, .atas .kanan a { padding: 9px 14px; font-size: 0.9rem; }
    .pilih-kloter { margin-top: 16px; }

    .stok-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 18px; }
    .stok-item { display: flex; align-items: center; gap: 12px; background: var(--kentang-muda); border-radius: 14px; padding: 12px 14px; }
    .stok-item .angka { font-family: var(--judul); font-weight: 800; font-size: 2.6rem; line-height: 1; }
    .stok-item.kecil { background: #fff; border: 1.5px solid var(--garis); }
    .stok-item.kecil .angka { font-size: 1.7rem; }
    .minus { color: var(--sambal); }
    .angka-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
    .angka-grid div { border: 1.5px solid var(--garis); border-radius: 12px; padding: 10px 12px; }
    .angka-grid b { display: block; font-family: var(--judul); font-size: 1.3rem; white-space: nowrap; }
    .angka-grid .muted { display: block; font-size: 0.75rem; }
    .angka-grid .untung { background: var(--kentang-muda); border-color: var(--kentang); }
    .rekap { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; margin-top: 12px; font-size: 0.95rem; }
    .rekap ul { list-style: none; padding: 0; margin: 4px 0; }
    .rekap li { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--garis); padding: 3px 0; }

    .tabs { display: flex; gap: 4px; margin-top: 26px; border-bottom: 1.5px solid var(--garis); }
    .tabs button { background: transparent; color: var(--abu); border-radius: 10px 10px 0 0; padding: 10px 14px; }
    .tabs button[aria-selected="true"] { color: var(--kecap); background: var(--kentang-muda); box-shadow: inset 0 -3px 0 var(--kentang); }

    .filter { display: flex; gap: 8px; margin: 14px 0; }
    .filter select { max-width: 200px; }
    .order { border: 1.5px solid var(--garis); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .order.baru { border-color: var(--kentang); }
    .order.batal { opacity: 0.6; }
    .order .kop { display: flex; justify-content: space-between; gap: 10px; }
    .order .nama { font-weight: 800; font-size: 1.05rem; }
    .order .total { font-family: var(--judul); font-weight: 800; font-size: 1.25rem; white-space: nowrap; }
    .order ul { padding-left: 18px; margin: 8px 0; }
    .kontrol { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; }
    .kontrol label { font-size: 0.8rem; font-weight: 700; color: var(--abu); }
    .kontrol select, .kontrol input { margin-top: 2px; padding: 8px 10px; }
    .aksi { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .ongkir-baris { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-top: 10px; }
    .ongkir-baris .cek { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem; padding: 8px 0; cursor: pointer; }
    .ongkir-baris .cek input { width: 20px; height: 20px; margin: 0; accent-color: var(--sambal); }
    .ongkir-baris .nominal { font-size: 0.8rem; font-weight: 700; color: var(--abu); max-width: 180px; }
    .ongkir-baris .nominal input { margin-top: 2px; padding: 8px 10px; }
    .order .sub-total { font-size: 0.8rem; color: var(--abu); text-align: right; }
    .aksi button { padding: 9px 16px; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: end; }
    .form-grid label { font-weight: 700; font-size: 0.9rem; }
    .form-grid input, .form-grid select { margin-top: 4px; }
    .plg { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--garis); }
    .plg .info { flex: 1; min-width: 0; }
    .plg select { width: 130px; padding: 8px; }

    .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 150%); background: var(--kecap); color: #fff;
      padding: 12px 18px; border-radius: 12px; max-width: 90vw; transition: transform 0.25s; z-index: 10; }
    .toast.show { transform: translate(-50%, 0); }
    .toast.err { background: var(--sambal); }
    .login { max-width: 320px; margin: 60px auto; }

    .modal-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
    .modal-form label { font-weight: 700; font-size: 0.85rem; }
    .modal-form input { margin-top: 3px; padding: 8px 10px; }
    .tabel-wrap { overflow-x: auto; margin-top: 10px; }
    .tabel { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .tabel th, .tabel td { padding: 7px 8px; border-bottom: 1px solid var(--garis); text-align: left; white-space: nowrap; }
    .tabel th { font-size: 0.8rem; color: var(--abu); }
    .tabel .kanan { text-align: right; }
    .tabel tfoot td { font-weight: 800; border-bottom: 0; }
    .btn-hapus { background: none; color: var(--sambal); padding: 4px 6px; font-size: 0.85rem; }
    .btn-edit { background: none; color: var(--kecap); padding: 4px 6px; font-size: 0.85rem; text-decoration: underline; }
    .btn-simpan { background: var(--sambal); color: #fff; padding: 5px 10px; font-size: 0.85rem; border-radius: 8px; }
    .tabel .aksi-baris { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
    .tabel .edit-baris td { background: var(--kentang-muda); vertical-align: middle; }
    .tabel .edit-baris input { padding: 6px 8px; font-size: 0.9rem; min-width: 80px; }
    .tabel .edit-baris input[data-e="item"] { min-width: 170px; }
    .tabel .edit-baris input[data-e="tanggal"] { min-width: 130px; }
    details.tambah { margin-top: 12px; border: 1.5px dashed var(--garis); border-radius: 12px; padding: 10px 12px; }
    details.tambah summary { cursor: pointer; font-weight: 700; }
    details.tambah .btn { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="login" class="login hidden">
      <h1 class="nama-toko">Kering Kentang Tara</h1>
      <p class="muted">Halaman penjual</p>
      <label class="f" for="pin">PIN admin</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
      <div id="loginErr"></div>
      <button type="button" class="btn" id="btnLogin" style="margin-top:14px;width:100%">Masuk</button>
    </section>

    <div id="loading" class="loading">Memuat…</div>

    <section id="main" class="hidden">
      <header class="atas">
        <div>
          <h1 class="nama-toko">Kering Kentang Tara</h1>
          <p class="muted">Halaman penjual</p>
        </div>
        <div class="kanan">
          <a class="btn-ghost" id="linkForm" href="#" target="_blank" style="border-radius:10px;text-decoration:none;font-weight:700">Buka form pesanan</a>
          <button type="button" class="btn-ghost" id="btnMuat">Muat ulang</button>
        </div>
      </header>

      <div class="pilih-kloter">
        <label class="f" for="selKloter" style="margin-top:0">Kloter</label>
        <select id="selKloter"></select>
      </div>

      <div id="ringkasan"></div>

      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="pesanan">Pesanan</button>
        <button type="button" role="tab" data-tab="kloter">Kloter & stok</button>
        <button type="button" role="tab" data-tab="pelanggan">Pelanggan</button>
      </nav>

      <div id="tabPesanan"></div>
      <div id="tabKloter" class="hidden"></div>
      <div id="tabPelanggan" class="hidden"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const ribuan = (n) => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const rp = (n) => (n < 0 ? '-Rp' : 'Rp') + ribuan(Math.abs(n || 0));
  const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  const tglPendek = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${Number(m[3])} ${BLN[Number(m[2]) - 1]}` : ''; };
  const kg = (n) => String(Math.round((n || 0) * 100) / 100).replace('.', ',');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const errMsg = (e) => String(e && e.message ? e.message : e).replace(/^Error:\s*/, '');
  const opsi = (list, pilih) => list.map((v) => `<option value="${esc(v)}" ${v === pilih ? 'selected' : ''}>${esc(v)}</option>`).join('');

  // ===== GANTI jika link Apps Script (/exec) berubah =====
  const API_URL = 'https://script.google.com/macros/s/AKfycbyhW9KrovtOrKoJYZmy5jC3jQKpwqGOjnuDoMaZQtI6PLo2Wkb087QeFA3JQkBpBMTHpQ/exec';

  async function call(fn, ...args) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 45000);
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args }),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error('Server bermasalah (kode ' + res.status + '). Coba lagi sebentar.');
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan di server.');
      return j.data;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('Server tidak merespons. Periksa koneksi internet lalu coba lagi.');
      if (e instanceof TypeError) throw new Error('Tidak bisa terhubung ke server. Periksa koneksi internet, lalu coba lagi.');
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  let PIN = '';
  try { PIN = sessionStorage.getItem('kk_pin') || ''; } catch (e) {}
  let A = null, kloterId = '', tab = 'pesanan', filterStatus = 'aktif', cariPlg = '';

  function toast(msg, err) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { t.className = 'toast'; }, 4000);
  }

  function tampilLogin(pesan) {
    $('loading').classList.add('hidden');
    $('main').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('loginErr').innerHTML = pesan ? `<div class="pesan err">${esc(pesan)}</div>` : '';
    $('pin').focus();
  }

  async function login() {
    const pin = $('pin').value.trim();
    if (!pin) return;
    $('btnLogin').disabled = true;
    try {
      await call('apiAdminLogin', pin);
      PIN = pin;
      try { sessionStorage.setItem('kk_pin', pin); } catch (e) {}
      $('login').classList.add('hidden');
      await muat();
    } catch (e) {
      tampilLogin(errMsg(e));
    } finally {
      $('btnLogin').disabled = false;
    }
  }

  async function muat() {
    if (!PIN) return tampilLogin('');
    try {
      A = await call('apiAdminData', PIN, kloterId);
    } catch (e) {
      const m = errMsg(e);
      if (/PIN/.test(m)) {
        PIN = '';
        try { sessionStorage.removeItem('kk_pin'); } catch (x) {}
        return tampilLogin(m);
      }
      $('loading').classList.add('hidden');
      return toast(m, true);
    }
    kloterId = A.kloter ? A.kloter.id : '';
    if (A.toko) document.querySelectorAll('.nama-toko').forEach((el) => { el.textContent = A.toko; });
    $('loading').classList.add('hidden');
    $('main').classList.remove('hidden');
    $('linkForm').href = A.urlOrder || '#';
    render();
  }

  function render() {
    $('selKloter').innerHTML = A.kloters.length
      ? A.kloters.map((k) => `<option value="${esc(k.id)}" ${k.id === kloterId ? 'selected' : ''}>${esc(k.nama)}${k.status !== 'Tutup' ? ' (' + k.status.toLowerCase() + ')' : ''}</option>`).join('')
      : '<option>Belum ada kloter</option>';
    renderRingkasan();
    renderTab();
  }

  function renderRingkasan() {
    const k = A.kloter;
    if (!k) {
      $('ringkasan').innerHTML = '<p class="pesan info">Belum ada kloter. Buka tab <strong>Kloter & stok</strong> untuk membuka kloter pertama.</p>';
      return;
    }
    const r = A.ringkasan;
    const daftar = (obj, fmt) => {
      const ks = Object.keys(obj);
      return ks.length ? '<ul>' + ks.map((x) => `<li><span>${esc(x)}</span><b>${fmt(obj[x])}</b></li>`).join('') + '</ul>' : '<p class="muted">Belum ada</p>';
    };
    $('ringkasan').innerHTML = `
      <div class="stok-grid">
        ${k.paket.map((p) => `
          <div class="stok-item">
            <div class="angka ${p.sisa <= 0 ? 'minus' : ''}">${p.sisa}</div>
            <div>${esc(p.nama)}<br><span class="muted">pcs tersisa dari ${p.stok}</span></div>
          </div>`).join('')}
        ${k.lebih.stok > 0 ? `
          <div class="stok-item">
            <div class="angka ${k.lebih.sisa <= 0 ? 'minus' : ''}">${k.lebih.sisa}</div>
            <div>Lebihan toples<br><span class="muted">pcs tersisa dari ${k.lebih.stok}</span></div>
          </div>` : ''}
        ${k.eceran.map((e) => `
          <div class="stok-item kecil">
            <div class="angka">±${e.n}</div>
            <div>${esc(e.nama)}<br><span class="muted">pcs bisa diisi</span></div>
          </div>`).join('')}
      </div>
      <p class="muted">Toples dan pouch diisi dari kemasan kiloan dan setengah kilo yang tersisa${k.lepas > 0 ? `, ditambah ${kg(k.lepas)} kg dari kemasan yang sudah dibuka` : ''}.</p>
      ${k.status === 'Habis' ? '<p class="pesan info"><strong>Stok habis.</strong> Kloter otomatis berhenti menerima pesanan baru. Pembeli masih bisa mengurangi atau membatalkan pesanan. Jika ada lebihan produksi, isi di tab Kloter & stok agar kloter terbuka lagi.</p>' : ''}
      ${k.kurang ? '<p class="pesan err">Pesanan melebihi stok. Tambah sisa pcs di tab Kloter & stok, atau kurangi pesanan.</p>' : ''}
      <div class="angka-grid">
        <div>Pesanan aktif<b>${r.jumlah}</b></div>
        <div>Total penjualan<b>${rp(r.omzet)}</b></div>
        <div>Sudah dibayar<b>${rp(r.lunas)}</b></div>
        <div>Belum dibayar<b>${rp(r.belum)}</b></div>
        <div>Total modal<b>${rp(r.modal)}</b></div>
        ${r.ongkir > 0 ? `<div>Ongkir ditagihkan<b>${rp(r.ongkir)}</b><span class="muted">tidak dihitung ke keuntungan</span></div>` : ''}
        <div class="untung">Keuntungan saat ini<b class="${r.untung < 0 ? 'minus' : ''}">${rp(r.untung)}</b><span class="muted">sudah dibayar dikurangi modal</span></div>
        <div>Estimasi keuntungan<b class="${r.estimasi < 0 ? 'minus' : ''}">${rp(r.estimasi)}</b><span class="muted">jika semua pesanan lunas</span></div>
      </div>
      <div class="rekap">
        <div><h3>Jumlah per produk</h3>${daftar(r.perProduk, (v) => v)}</div>
        <div><h3>Uang masuk${r.ongkirLunas > 0 ? ' (termasuk ongkir)' : ''}</h3>${daftar(r.perBayar, rp)}</div>
      </div>`;
  }

  function renderTab() {
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    $('tabPesanan').classList.toggle('hidden', tab !== 'pesanan');
    $('tabKloter').classList.toggle('hidden', tab !== 'kloter');
    $('tabPelanggan').classList.toggle('hidden', tab !== 'pelanggan');
    if (tab === 'pesanan') renderPesanan();
    if (tab === 'kloter') renderKloter();
    if (tab === 'pelanggan') renderPelanggan();
  }

  function renderPesanan() {
    const list = A.pesanan.filter((o) => {
      if (filterStatus === 'aktif') return o.status !== 'Dibatalkan' && o.status !== 'Selesai';
      if (filterStatus === 'belum-bayar') return o.status !== 'Dibatalkan' && o.statusBayar === 'Belum bayar';
      if (filterStatus === 'semua') return true;
      return o.status === filterStatus;
    });
    const pilihan = [['aktif', 'Belum selesai'], ['belum-bayar', 'Belum bayar'], ['semua', 'Semua']]
      .concat(A.status.map((s) => [s, s]));
    $('tabPesanan').innerHTML = `
      <div class="filter">
        <select id="filterStatus" aria-label="Saring pesanan">
          ${pilihan.map(([v, l]) => `<option value="${esc(v)}" ${v === filterStatus ? 'selected' : ''}>${esc(l)}</option>`).join('')}
        </select>
      </div>
      ${list.length ? list.map(kartuPesanan).join('') : '<p class="muted">Tidak ada pesanan untuk filter ini.</p>'}`;
  }

  function kartuPesanan(o) {
    const kelas = o.status === 'Baru' ? 'baru' : (o.status === 'Dibatalkan' ? 'batal' : '');
    const adaOngkir = o.ongkir > 0;
    const kunciOngkir = o.statusBayar === 'Lunas';
    return `
      <article class="order ${kelas}" data-id="${esc(o.id)}">
        <div class="kop">
          <div>
            <div class="nama">${esc(o.nama)} ${o.jenis === 'reseller' ? '<span class="badge">reseller</span>' : ''}</div>
            <div class="muted">${esc(o.id)}, dipesan ${esc(o.waktu)}${o.diubah && o.diubah !== o.waktu ? ', diubah ' + esc(o.diubah) : ''}</div>
          </div>
          <div>
            <div class="total">${rp(o.tagihan != null ? o.tagihan : o.total)}</div>
            ${adaOngkir ? `<div class="sub-total">produk ${rp(o.total)} + ongkir ${rp(o.ongkir)}</div>` : ''}
          </div>
        </div>
        <ul>${o.items.map((i) => `<li>${esc(i.nama)} ${i.qty} x ${ribuan(i.harga)}</li>`).join('')}</ul>
        <div class="muted">${kg(o.kg)} kg${o.alamat ? '. ' + esc(o.alamat) : ''}</div>
        <div class="kontrol">
          <label>Status<select data-f="status">${opsi(A.status, o.status)}</select></label>
          <label>Pembayaran<select data-f="statusBayar">${opsi(A.statusBayar, o.statusBayar)}</select></label>
          <label>Cara bayar<select data-f="caraBayar">${opsi(A.caraBayar, o.caraBayar)}</select></label>
          <label>Tanggal antar<input type="date" data-f="tglAntar" value="${esc(o.tglAntar)}" ${o.status === 'Diantar' ? '' : 'disabled'} title="Bisa diisi saat status Diantar"></label>
        </div>
        <div class="ongkir-baris">
          <label class="cek"><input type="checkbox" data-f="adaOngkir" ${adaOngkir ? 'checked' : ''} ${kunciOngkir ? 'disabled' : ''}> Ada ongkir?</label>
          <label class="nominal ${adaOngkir ? '' : 'hidden'}">Ongkir (Rp)<input type="number" data-f="ongkir" min="0" step="500" inputmode="numeric" placeholder="15000" value="${adaOngkir ? o.ongkir : ''}" ${kunciOngkir ? 'disabled' : ''}></label>
          ${kunciOngkir && adaOngkir ? '<span class="muted">Pesanan sudah lunas, ongkir tidak bisa diubah.</span>' : ''}
        </div>
        <div class="aksi">
          <button type="button" class="btn" data-act="simpan">Simpan</button>
          ${o.statusBayar === 'Lunas' ? '<button type="button" class="btn-ghost" data-act="rincian">Kirim ulang rincian</button>' : ''}
          <a href="https://wa.me/${esc(o.wa)}" target="_blank" rel="noopener">Chat ${esc(o.wa)}</a>
        </div>
      </article>`;
  }

  async function simpanPesanan(card, btn) {
    const data = {};
    card.querySelectorAll('[data-f]').forEach((el) => { data[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; });
    if (data.status === 'Selesai' && !data.tglAntar) return toast('Isi tanggal antar dulu (pilih status Diantar) sebelum mengubah ke Selesai.', true);
    if (data.adaOngkir && !(Number(data.ongkir) > 0)) return toast('Isi nominal ongkir, atau hapus centang "Ada ongkir?".', true);
    btn.disabled = true;
    btn.textContent = 'Menyimpan…';
    try {
      const r = await call('apiUpdatePesanan', PIN, card.dataset.id, data);
      const gagal = r.terkirim.filter((x) => !x.ok).map((x) => x.jenis);
      const ok = r.terkirim.filter((x) => x.ok).map((x) => x.jenis);
      let msg = 'Tersimpan.';
      if (ok.length) msg += ' WA ' + ok.join(' & ') + ' terkirim.';
      if (gagal.length) msg += ' WA ' + gagal.join(' & ') + ' gagal, cek sheet Log_WA.';
      toast(msg, gagal.length > 0);
      await muat();
    } catch (e) {
      toast(errMsg(e), true);
      btn.disabled = false;
      btn.textContent = 'Simpan';
    }
  }

  async function kirimRincian(card, btn) {
    btn.disabled = true;
    try {
      const ok = await call('apiKirimRincian', PIN, card.dataset.id);
      toast(ok ? 'Rincian transaksi terkirim.' : 'WA gagal terkirim, cek sheet Log_WA.', !ok);
    } catch (e) {
      toast(errMsg(e), true);
    } finally {
      btn.disabled = false;
    }
  }

  let modalBaru = [];
  let editModal = null; // { attr, key } baris modal yang sedang diedit
  let draftKloter = { nama: '', kilo: '', setengah: '' };

  function simpanDraft() {
    if (!$('nNama')) return;
    draftKloter = { nama: $('nNama').value, kilo: $('nKilo').value, setengah: $('nSetengah').value };
  }

  function inputModal(p) {
    return `
      <div class="modal-form">
        <label>Tanggal<input type="date" id="${p}Tgl" value="${esc(A.hariIni)}"></label>
        <label>Item modal<input id="${p}Item" placeholder="Contoh: Kering kentang"></label>
        <label>Harga satuan<input id="${p}Harga" type="number" inputmode="decimal" step="any" placeholder="65000"></label>
        <label>Satuan<input id="${p}Satuan" placeholder="kg / pcs / -"></label>
        <label>Jumlah<input id="${p}Jumlah" type="number" inputmode="decimal" step="any" value="1"></label>
        <label>Keterangan<input id="${p}Ket" placeholder="Opsional"></label>
      </div>`;
  }

  function bacaModal(p) {
    return {
      tanggal: $(p + 'Tgl').value, item: $(p + 'Item').value.trim(), harga: $(p + 'Harga').value,
      satuan: $(p + 'Satuan').value.trim(), jumlah: $(p + 'Jumlah').value, ket: $(p + 'Ket').value.trim()
    };
  }

  function cekModal(m) {
    if (!m.item) return 'Isi nama item modal.';
    if (m.harga === '' || isNaN(Number(m.harga))) return 'Isi harga satuan (boleh minus untuk diskon atau voucher).';
    if (!(Number(m.jumlah) > 0)) return 'Jumlah harus lebih dari 0.';
    return '';
  }

  function tabelModal(list, attr) {
    if (!list.length) return '<p class="muted">Belum ada item modal.</p>';
    const total = list.reduce((a, m) => a + Number(m.harga) * Number(m.jumlah), 0);
    const baris = (m, i) => {
      const key = String(m.id !== undefined ? m.id : i);
      if (editModal && editModal.attr === attr && editModal.key === key) {
        return `
          <tr class="edit-baris">
            <td>${i + 1}</td>
            <td><input type="date" data-e="tanggal" value="${esc(m.tanggal)}" aria-label="Tanggal"></td>
            <td><input data-e="item" value="${esc(m.item)}" aria-label="Item modal"></td>
            <td><input type="number" step="any" inputmode="decimal" data-e="harga" value="${esc(m.harga)}" aria-label="Harga satuan"></td>
            <td><input data-e="satuan" value="${esc(m.satuan)}" aria-label="Satuan"></td>
            <td><input type="number" step="any" inputmode="decimal" data-e="jumlah" value="${esc(m.jumlah)}" aria-label="Jumlah"></td>
            <td class="kanan muted">otomatis</td>
            <td><input data-e="ket" value="${esc(m.ket)}" aria-label="Keterangan"></td>
            <td><div class="aksi-baris">
              <button type="button" class="btn-simpan" data-simpan-edit="${esc(attr)}" data-key="${esc(key)}">Simpan</button>
              <button type="button" class="btn-hapus" data-batal-edit>Batal</button>
            </div></td>
          </tr>`;
      }
      return `
          <tr>
            <td>${i + 1}</td><td>${esc(tglPendek(m.tanggal))}</td><td>${esc(m.item)}</td>
            <td class="kanan">${ribuan(Number(m.harga))}</td><td>${esc(m.satuan || '-')}</td>
            <td class="kanan">${esc(String(m.jumlah).replace('.', ','))}</td>
            <td class="kanan">${ribuan(Number(m.harga) * Number(m.jumlah))}</td><td>${esc(m.ket)}</td>
            <td><div class="aksi-baris">
              <button type="button" class="btn-edit" data-edit="${esc(attr)}" data-key="${esc(key)}" aria-label="Edit ${esc(m.item)}">Edit</button>
              <button type="button" class="btn-hapus" ${attr}="${esc(key)}" aria-label="Hapus ${esc(m.item)}">Hapus</button>
            </div></td>
          </tr>`;
    };
    return `
      <div class="tabel-wrap"><table class="tabel">
        <thead><tr><th>No</th><th>Tanggal</th><th>Item</th><th class="kanan">Harga</th><th>Satuan</th>
          <th class="kanan">Jumlah</th><th class="kanan">Total</th><th>Ket.</th><th></th></tr></thead>
        <tbody>${list.map(baris).join('')}</tbody>
        <tfoot><tr><td colspan="6">Total modal</td><td class="kanan">${rp(total)}</td><td colspan="2"></td></tr></tfoot>
      </table></div>`;
  }

  function renderKloter() {
    const k = A.kloter;
    $('tabKloter').innerHTML = `
      ${k ? `
      <h2>Ubah kloter terpilih</h2>
      <div class="form-grid">
        <label>Nama kloter<input id="kNama" value="${esc(k.nama)}"></label>
        <label>Status<select id="kStatus">${opsi(k.status === 'Habis' ? ['Habis', 'Buka', 'Tutup'] : ['Buka', 'Tutup'], k.status)}</select></label>
        ${k.paket.map((p) => `<label>Sisa ${esc(p.nama)} (pcs)<input id="kSisa${esc(p.kode)}" class="sisa-paket" type="number" min="0" step="1" inputmode="numeric" value="${p.sisa}"></label>`).join('')}
        <label>Lebihan toples (pcs)<input id="kLebih" type="number" min="0" step="1" inputmode="numeric" value="${k.lebih.sisa}" ${k.bisaIsiLebih ? '' : 'disabled'}></label>
        <button type="button" class="btn" id="btnSimpanKloter">Simpan kloter</button>
      </div>
      <p class="muted" id="infoLebih">${k.bisaIsiLebih
        ? 'Isi lebihan toples dari hasil produksi. Pesanan toples berikutnya akan mengambil dari lebihan ini.'
        : 'Lebihan toples baru bisa diisi setelah sisa kiloan dan setengah kilo 0.'}</p>
      <p class="muted">Ubah sisa pcs saat ada kemasan tambahan, rusak, atau dipakai sendiri; stok awal kloter ikut disesuaikan. Status Tutup menghentikan pesanan baru dan perubahan dari pelanggan. Status Habis diatur otomatis saat semua stok 0.</p>

      <h2>Modal ${esc(k.nama)}</h2>
      ${tabelModal(A.modal, 'data-hapus-modal')}
      <details class="tambah">
        <summary>Tambah item modal</summary>
        ${inputModal('m')}
        <button type="button" class="btn" id="btnTambahModal">Tambah item modal</button>
      </details>` : ''}

      <h2>Buka kloter baru</h2>
      <div class="form-grid">
        <label>Nama kloter<input id="nNama" value="${esc(draftKloter.nama || A.saranNamaKloter)}"></label>
        <label>Stok kiloan (pcs)<input id="nKilo" type="number" min="0" step="1" inputmode="numeric" placeholder="10" value="${esc(draftKloter.kilo)}"></label>
        <label>Stok setengah kilo (pcs)<input id="nSetengah" type="number" min="0" step="1" inputmode="numeric" placeholder="10" value="${esc(draftKloter.setengah)}"></label>
      </div>
      <h3 style="margin-top:20px">Daftar modal kloter baru</h3>
      <p class="muted">Masukkan semua biaya kloter ini: bahan, kemasan, stiker, ongkir. Diskon atau voucher ditulis dengan harga minus. Kloter baru hanya bisa dibuka setelah daftar modal diisi.</p>
      ${inputModal('b')}
      <div class="aksi">
        <button type="button" class="btn-ghost" id="btnTambahBaru">Tambah ke daftar</button>
        ${A.modal.length ? '<button type="button" class="btn-ghost" id="btnSalinModal">Salin modal kloter terpilih</button>' : ''}
      </div>
      ${tabelModal(modalBaru, 'data-hapus-baru')}
      <div class="aksi" style="margin-top:14px">
        <button type="button" class="btn" id="btnKloterBaru" ${modalBaru.length ? '' : 'disabled'}>Buka kloter baru</button>
        <span class="muted">${modalBaru.length ? 'Kloter lain yang masih buka akan ditutup otomatis.' : 'Isi minimal satu item modal terlebih dahulu.'}</span>
      </div>`;

    if (k) {
      $('btnSimpanKloter').onclick = () => simpanKloter({
        id: k.id, nama: $('kNama').value, status: $('kStatus').value,
        sisaKilo: $('kSisaKILO') ? $('kSisaKILO').value : '',
        sisaSetengah: $('kSisaSETENGAH') ? $('kSisaSETENGAH').value : '',
        sisaLebih: $('kLebih').disabled ? '' : $('kLebih').value
      }, $('btnSimpanKloter'));
      // Kolom lebihan aktif hanya bila sisa kiloan & setengah kilo yang diisi = 0.
      const cekLebih = () => {
        const nol = [...document.querySelectorAll('.sisa-paket')].every((el) => Number(el.value) === 0 && el.value !== '');
        $('kLebih').disabled = !nol;
        $('infoLebih').textContent = nol
          ? 'Isi lebihan toples dari hasil produksi. Pesanan toples berikutnya akan mengambil dari lebihan ini.'
          : 'Lebihan toples baru bisa diisi setelah sisa kiloan dan setengah kilo 0.';
      };
      document.querySelectorAll('.sisa-paket').forEach((el) => el.addEventListener('input', cekLebih));
      $('kLebih').addEventListener('input', () => { if (Number($('kLebih').value) > 0 && $('kStatus').value === 'Habis') $('kStatus').value = 'Buka'; });
      $('btnTambahModal').onclick = async () => {
        const m = bacaModal('m');
        const e = cekModal(m);
        if (e) return toast(e, true);
        const btn = $('btnTambahModal');
        btn.disabled = true;
        simpanDraft();
        try {
          await call('apiTambahModal', PIN, k.id, m);
          toast('Item modal ditambahkan.');
          await muat();
        } catch (err) {
          toast(errMsg(err), true);
          btn.disabled = false;
        }
      };
    }
    $('btnTambahBaru').onclick = () => {
      const m = bacaModal('b');
      const e = cekModal(m);
      if (e) return toast(e, true);
      simpanDraft();
      modalBaru.push(m);
      renderKloter();
      $('bItem').focus();
    };
    if ($('btnSalinModal')) {
      $('btnSalinModal').onclick = () => {
        simpanDraft();
        modalBaru = A.modal.map((m) => ({ tanggal: A.hariIni, item: m.item, harga: m.harga, satuan: m.satuan, jumlah: m.jumlah, ket: m.ket }));
        renderKloter();
        toast('Modal disalin. Sesuaikan harga atau jumlah yang berbeda.');
      };
    }
    $('btnKloterBaru').onclick = () => {
      if (!modalBaru.length) return toast('Isi daftar modal terlebih dahulu.', true);
      if ($('nKilo').value === '' && $('nSetengah').value === '') return toast('Isi stok kiloan atau setengah kilo (pcs).', true);
      simpanKloter({
        nama: $('nNama').value, stokKilo: $('nKilo').value || 0, stokSetengah: $('nSetengah').value || 0, modal: modalBaru
      }, $('btnKloterBaru'), true);
    };
  }

  async function simpanKloter(d, btn, baru) {
    btn.disabled = true;
    if (!baru) simpanDraft();
    try {
      const id = await call('apiSimpanKloter', PIN, d);
      if (baru) {
        kloterId = id;
        modalBaru = [];
        draftKloter = { nama: '', kilo: '', setengah: '' };
      }
      toast(baru ? 'Kloter baru dibuka.' : 'Kloter tersimpan.');
      await muat();
    } catch (e) {
      toast(errMsg(e), true);
      btn.disabled = false;
    }
  }

  $('tabKloter').addEventListener('click', async (e) => {
    // Edit baris modal
    const tEdit = e.target.closest('[data-edit]');
    if (tEdit) {
      simpanDraft();
      editModal = { attr: tEdit.dataset.edit, key: tEdit.dataset.key };
      renderKloter();
      const input = document.querySelector('.edit-baris input[data-e="item"]');
      if (input) input.focus();
      return;
    }
    if (e.target.closest('[data-batal-edit]')) {
      simpanDraft();
      editModal = null;
      return renderKloter();
    }
    const tSimpan = e.target.closest('[data-simpan-edit]');
    if (tSimpan) {
      const tr = tSimpan.closest('tr');
      const m = {};
      tr.querySelectorAll('[data-e]').forEach((el) => { m[el.dataset.e] = el.value.trim(); });
      const salah = cekModal(m);
      if (salah) return toast(salah, true);
      simpanDraft();
      if (tSimpan.dataset.simpanEdit === 'data-hapus-baru') {
        modalBaru[Number(tSimpan.dataset.key)] = m;
        editModal = null;
        toast('Item modal diperbarui.');
        return renderKloter();
      }
      tSimpan.disabled = true;
      tSimpan.textContent = 'Menyimpan…';
      try {
        await call('apiUbahModal', PIN, tSimpan.dataset.key, m);
        editModal = null;
        toast('Item modal diperbarui.');
        await muat();
      } catch (err) {
        toast(errMsg(err), true);
        tSimpan.disabled = false;
        tSimpan.textContent = 'Simpan';
      }
      return;
    }
    const baru = e.target.closest('[data-hapus-baru]');
    if (baru) {
      simpanDraft();
      editModal = null;
      modalBaru.splice(Number(baru.dataset.hapusBaru), 1);
      return renderKloter();
    }
    const lama = e.target.closest('[data-hapus-modal]');
    if (lama) {
      if (!confirm('Hapus item modal ini?')) return;
      lama.disabled = true;
      simpanDraft();
      try {
        await call('apiHapusModal', PIN, lama.dataset.hapusModal);
        toast('Item modal dihapus.');
        await muat();
      } catch (err) {
        toast(errMsg(err), true);
        lama.disabled = false;
      }
    }
  });

  function renderPelanggan() {
    const q = cariPlg.toLowerCase();
    const list = A.pelanggan.filter((p) => !q || p.nama.toLowerCase().includes(q) || p.wa.includes(q));
    $('tabPelanggan').innerHTML = `
      <h2>Tambah atau ubah pelanggan</h2>
      <div class="form-grid">
        <label>No WhatsApp<input id="pWa" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx"></label>
        <label>Nama<input id="pNama"></label>
        <label>Jenis harga<select id="pJenis">${opsi(A.jenisHarga, 'normal')}</select></label>
        <button type="button" class="btn" id="btnSimpanPlg">Simpan pelanggan</button>
      </div>
      <p class="muted">Jika nomor sudah terdaftar, nama dan jenis harganya diperbarui. Jenis harga berlaku untuk pesanan baru dan pesanan yang diubah pelanggan.</p>
      <h2>Daftar pelanggan (${A.pelanggan.length})</h2>
      <input id="cariPlg" placeholder="Cari nama atau nomor" value="${esc(cariPlg)}" aria-label="Cari pelanggan">
      <div id="listPlg">
        ${list.length ? list.map((p) => `
          <div class="plg" data-wa="${esc(p.wa)}">
            <div class="info"><strong>${esc(p.nama)}</strong><div class="muted">${esc(p.wa)}</div></div>
            <select data-jenis aria-label="Jenis harga ${esc(p.nama)}">${opsi(A.jenisHarga, p.jenis)}</select>
          </div>`).join('') : '<p class="muted">Belum ada pelanggan yang cocok.</p>'}
      </div>`;
    $('btnSimpanPlg').onclick = async () => {
      const btn = $('btnSimpanPlg');
      btn.disabled = true;
      try {
        const r = await call('apiSimpanPelanggan', PIN, { wa: $('pWa').value, nama: $('pNama').value, jenis: $('pJenis').value });
        toast('Pelanggan tersimpan.' + (r && r.diperbarui ? ` ${r.diperbarui} pesanan belum dibayar ikut disesuaikan harganya.` : ''));
        await muat();
      } catch (e) {
        toast(errMsg(e), true);
        btn.disabled = false;
      }
    };
    $('cariPlg').oninput = (e) => {
      cariPlg = e.target.value;
      const pos = e.target.selectionStart;
      renderPelanggan();
      $('cariPlg').focus();
      $('cariPlg').setSelectionRange(pos, pos);
    };
  }

  $('tabPelanggan').addEventListener('change', async (e) => {
    if (!e.target.matches('select[data-jenis]')) return;
    const row = e.target.closest('.plg');
    const p = A.pelanggan.find((x) => x.wa === row.dataset.wa);
    e.target.disabled = true;
    try {
      const r = await call('apiSimpanPelanggan', PIN, { wa: p.wa, nama: p.nama, jenis: e.target.value });
      p.jenis = e.target.value;
      toast(`${p.nama} sekarang memakai harga ${p.jenis}.` + (r && r.diperbarui ? ` ${r.diperbarui} pesanan belum dibayar ikut disesuaikan.` : ''));
      if (r && r.diperbarui) muat();
    } catch (err) {
      toast(errMsg(err), true);
      e.target.value = p.jenis;
    } finally {
      e.target.disabled = false;
    }
  });

  $('tabPesanan').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const card = btn.closest('.order');
    if (btn.dataset.act === 'simpan') simpanPesanan(card, btn);
    if (btn.dataset.act === 'rincian') kirimRincian(card, btn);
  });
  $('tabPesanan').addEventListener('change', (e) => {
    if (e.target.id === 'filterStatus') { filterStatus = e.target.value; renderPesanan(); return; }
    const card = e.target.closest('.order');
    if (!card) return;
    // Tanggal antar hanya aktif saat status Diantar.
    if (e.target.matches('select[data-f=status]')) {
      card.querySelector('[data-f=tglAntar]').disabled = e.target.value !== 'Diantar';
    }
    // Centang "Ada ongkir?" menampilkan kolom nominal ongkir.
    if (e.target.matches('input[data-f=adaOngkir]')) {
      const kotak = card.querySelector('.nominal');
      kotak.classList.toggle('hidden', !e.target.checked);
      if (e.target.checked) kotak.querySelector('input').focus();
    }
  });
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; renderTab(); }));
  $('selKloter').addEventListener('change', (e) => { kloterId = e.target.value; editModal = null; muat(); });
  $('btnMuat').addEventListener('click', () => { $('btnMuat').disabled = true; muat().finally(() => { $('btnMuat').disabled = false; }); });
  $('btnLogin').addEventListener('click', login);
  $('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

  muat();
</script>
</body>
</html>
